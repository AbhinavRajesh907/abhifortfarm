volumes:
  production_django_media: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: agrivision_production_django
    volumes:
      - production_django_media:/app/agrivision/media
    depends_on:
      - redis
    env_file:
      - ./.envs/.production/.django
    command: /start
    restart: always

  redis:
    image: docker.io/redis:7.2
    restart: always

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: agrivision_production_nginx
    depends_on:
      - django
    ports:
      - '80:80'
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
    restart: always
