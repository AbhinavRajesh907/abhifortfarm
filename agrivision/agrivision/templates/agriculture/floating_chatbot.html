{% load static i18n %}
<!-- Floating AI Agronomist Chatbot Widget -->
{% if request.user.is_authenticated %}
<style>
  /* Custom display and scrollbar rules for floating chatbot */
  #agriChatbotWindow:not(.d-none) {
    display: flex !important;
    flex-direction: column !important;
    height: 580px !important;
    max-height: calc(100vh - 100px) !important;
  }

  #agriChatbotWindow.d-none {
    display: none !important;
  }

  #floatingChatStream {
    min-height: 0 !important;
    flex: 1 1 0% !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  #floatingChatStream::-webkit-scrollbar {
    width: 6px !important;
  }
  #floatingChatStream::-webkit-scrollbar-track {
    background: #f1f1f1;
  }
  #floatingChatStream::-webkit-scrollbar-thumb {
    background: #138844 !important;
    border-radius: 4px;
  }
  #floatingChatStream::-webkit-scrollbar-thumb:hover {
    background: #0e6332 !important;
  }

  #floatingQuickChips {
    overflow-x: auto !important;
    white-space: nowrap !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    cursor: grab;
    user-select: none;
    flex-shrink: 0 !important;
  }
  #floatingQuickChips:active {
    cursor: grabbing;
  }
  #floatingQuickChips::-webkit-scrollbar {
    height: 4px;
  }
  #floatingQuickChips::-webkit-scrollbar-thumb {
    background: #138844;
    border-radius: 4px;
  }

  .floating-qr-btn {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
    font-size: 0.8rem !important;
    border-color: #138844 !important;
    color: #138844 !important;
    transition: all 0.2s ease-in-out;
  }
  .floating-qr-btn:hover {
    background-color: #138844 !important;
    color: #ffffff !important;
  }

  .markdown-body h6 {
    color: #138844;
    margin-top: 8px;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .markdown-body strong {
    color: #1a1a1a;
  }
  .markdown-body code {
    background-color: #eaf5ee;
    color: #138844;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.82rem;
  }
</style>

<div id="agriChatbotWidget" class="position-fixed" style="bottom: 25px; right: 25px; z-index: 1080;">
  
  <!-- Floating Chat Launcher Button -->
  <button id="agriChatbotToggleBtn" 
          type="button" 
          class="btn btn-success rounded-circle shadow-lg d-flex align-items-center justify-content-center border border-2 border-white transition-all position-relative"
          style="width: 60px; height: 60px; font-size: 1.5rem; background-color: #138844;"
          title="Open AI Agronomist Chatbot">
    <i class="bi bi-chat-dots-fill" id="agriChatbotIcon"></i>
    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
      <span class="visually-hidden">AI Active</span>
    </span>
  </button>

  <!-- Floating Chat Window Card -->
  <div id="agriChatbotWindow" 
       class="card border-0 shadow-lg rounded-4 d-none overflow-hidden position-absolute bottom-0 end-0 mb-5" 
       style="width: 400px; max-width: calc(100vw - 30px); transition: all 0.3s ease-in-out;">
    
    <!-- Chat Header (Solid Green #138844) -->
    <div class="card-header border-0 py-3 px-3 d-flex align-items-center justify-content-between text-white flex-shrink-0" style="background-color: #138844;">
      <div class="d-flex align-items-center gap-2">
        <div class="bg-white text-success rounded-circle d-flex align-items-center justify-content-center shadow-sm flex-shrink-0" style="width: 38px; height: 38px; font-size: 1.2rem;">
          🌱
        </div>
        <div>
          <h6 class="mb-0 fw-bold text-white fs-6" style="line-height: 1.2;">AgriBot — AI Assistant</h6>
          <small class="text-white-50 d-flex align-items-center gap-1" style="font-size: 0.75rem;">
            <span class="rounded-circle d-inline-block" style="width: 8px; height: 8px; background-color: #ffc107;"></span> Online • Agronomist AI
          </small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-1">
        <button type="button" class="btn btn-sm text-white p-1" id="floatingClearChatBtn" title="Clear Chat History">
          <i class="bi bi-trash3 fs-5"></i>
        </button>
        <button type="button" class="btn btn-sm text-white p-1" id="agriChatbotCloseBtn" title="Close Chatbot">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>
    </div>

    <!-- Chat Messages Stream (Strict Flex Grow & Vertical Scrollable) -->
    <div class="card-body p-3 overflow-y-auto flex-grow-1" id="floatingChatStream" style="background-color: #f8faf8; min-height: 0;">
    </div>

    <!-- Quick Chips Bar (Horizontal Sliding Container) -->
    <div class="bg-light px-3 py-2 border-top border-bottom flex-shrink-0 d-flex align-items-center gap-2" id="floatingQuickChips">
      <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 py-1 floating-qr-btn" data-prompt="📸 Upload a leaf photo for disease diagnosis">
        📸 Disease Diagnosis
      </button>
      <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 py-1 floating-qr-btn" data-prompt="Recommend best crops for Kharif season">
        🍂 Kharif Season
      </button>
      <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 py-1 floating-qr-btn" data-prompt="Recommend crops for Clay soil with pH 6.5">
        🪴 Clay Soil
      </button>
      <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-3 py-1 floating-qr-btn" data-prompt="Check current market price for Rice and Wheat">
        📈 Market Prices
      </button>
    </div>

    <!-- Attached Image Preview Bar -->
    <div id="floatingImagePreview" class="px-3 py-2 bg-success-subtle border-top flex-shrink-0 d-none align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2 text-truncate" style="max-width: 85%;">
        <i class="bi bi-image text-success fs-5"></i>
        <span class="small text-success-emphasis fw-semibold text-truncate" id="floatingImageName" style="font-size: 0.8rem;">leaf.jpg</span>
      </div>
      <button type="button" class="btn-close btn-close-sm" id="floatingRemoveImageBtn"></button>
    </div>

    <!-- Chat Footer Input Form -->
    <div class="card-footer bg-white p-2 border-0 flex-shrink-0">
      <form id="floatingChatForm" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" id="floatingChatImageInput" name="image" class="d-none" accept="image/jpeg,image/png,image/webp,image/jpg" />
        <div class="input-group align-items-center">
          <button type="button" class="btn btn-light border-0 px-2 text-success" id="floatingAttachPhotoBtn" title="Attach Leaf Photo for AI Disease Diagnosis">
            <i class="bi bi-camera-fill fs-5" style="color: #138844;"></i>
          </button>
          <input type="text" id="floatingChatMessageInput" class="form-control border-0 shadow-none px-2" style="font-size: 0.88rem;" placeholder="Ask AgriBot or attach leaf photo..." autocomplete="off" />
          <button type="submit" class="btn btn-success rounded-3 px-3" id="floatingSendBtn" style="background-color: #138844; border-color: #138844;">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('agriChatbotToggleBtn');
    const closeBtn = document.getElementById('agriChatbotCloseBtn');
    const chatWindow = document.getElementById('agriChatbotWindow');
    const chatStream = document.getElementById('floatingChatStream');
    const chatForm = document.getElementById('floatingChatForm');
    const chatMessageInput = document.getElementById('floatingChatMessageInput');
    const chatImageInput = document.getElementById('floatingChatImageInput');
    const attachPhotoBtn = document.getElementById('floatingAttachPhotoBtn');
    const imagePreview = document.getElementById('floatingImagePreview');
    const imageName = document.getElementById('floatingImageName');
    const removeImageBtn = document.getElementById('floatingRemoveImageBtn');
    const clearChatBtn = document.getElementById('floatingClearChatBtn');
    const quickChips = document.getElementById('floatingQuickChips');
    const quickPromptBtns = document.querySelectorAll('.floating-qr-btn');

    if (!toggleBtn || !chatWindow) return;

    const USERNAME = "{{ request.user.username|default:'user' }}";
    const HISTORY_KEY = `agri_chat_history_${USERNAME}`;

    // Mouse Drag-to-Slide for Quick Chips Bar
    let isMouseDown = false;
    let startX, scrollLeftPos;

    quickChips.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      startX = e.pageX - quickChips.offsetLeft;
      scrollLeftPos = quickChips.scrollLeft;
    });
    quickChips.addEventListener('mouseleave', () => { isMouseDown = false; });
    quickChips.addEventListener('mouseup', () => { isMouseDown = false; });
    quickChips.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      e.preventDefault();
      const x = e.pageX - quickChips.offsetLeft;
      const walk = (x - startX) * 2;
      quickChips.scrollLeft = scrollLeftPos - walk;
    });

    // Welcome Message HTML (Without Robot Face Avatar)
    function getWelcomeMessageHtml() {
      const displayName = "{{ request.user.name|default:request.user.email|escapejs }}";
      return `
        <div class="d-flex mb-3" id="welcomeMessageDiv">
          <div class="bg-white p-3 rounded-4 shadow-sm border border-light" style="max-width: 92%; font-size: 0.88rem;">
            <h6 class="fw-bold text-success mb-2" style="color: #138844 !important; font-size: 0.95rem;">Hello, ${escapeHtml(displayName)}! 👋</h6>
            <p class="mb-2 text-dark">I am your <strong>AI Agronomist Chatbot</strong>. How can I help you today?</p>
            <ul class="mb-2 ps-3 text-secondary" style="font-size: 0.82rem;">
              <li class="mb-1">📸 <strong>Disease Detection</strong>: Upload a leaf photo for AI diagnosis.</li>
              <li class="mb-1">🌱 <strong>Crop Advisory</strong>: Get optimal crop suggestions by soil/season.</li>
              <li class="mb-1">📈 <strong>Market Prices</strong>: Query live mandi rates for crops.</li>
            </ul>
            <p class="mb-0 text-muted small" style="font-size: 0.78rem;">Tap a prompt below or type your question!</p>
          </div>
        </div>`;
    }

    // Load Chat History
    function loadChatHistory() {
      chatStream.innerHTML = '';
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved) {
        try {
          const history = JSON.parse(saved);
          if (history && history.length > 0) {
            history.forEach(item => {
              if (item.type === 'user') {
                renderUserMessage(item.text, item.imageName, item.imageSrc, false);
              } else if (item.type === 'bot') {
                renderBotMessage(item.data, false);
              } else if (item.type === 'error') {
                renderBotErrorMessage(item.text, false);
              }
            });
            scrollToBottom();
            return;
          }
        } catch (e) {
          console.error("Error parsing chat history", e);
        }
      }
      chatStream.innerHTML = getWelcomeMessageHtml();
      scrollToBottom();
    }

    // Save Message to LocalStorage
    function saveHistoryItem(item) {
      try {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        history.push(item);
        if (history.length > 40) history = history.slice(-40);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) {
        console.error("Error saving chat history", e);
      }
    }

    function scrollToBottom() {
      setTimeout(() => {
        chatStream.scrollTop = chatStream.scrollHeight;
      }, 80);
    }

    loadChatHistory();

    // Toggle Chat Window
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      chatWindow.classList.toggle('d-none');
      if (!chatWindow.classList.contains('d-none')) {
        chatMessageInput.focus();
        scrollToBottom();
      }
    });

    // Close Chat Window
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      chatWindow.classList.add('d-none');
    });

    // Attach Photo Trigger
    attachPhotoBtn.addEventListener('click', () => chatImageInput.click());

    chatImageInput.addEventListener('change', () => {
      if (chatImageInput.files && chatImageInput.files[0]) {
        const file = chatImageInput.files[0];
        imageName.textContent = `Attached: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        imagePreview.classList.remove('d-none');
        imagePreview.classList.add('d-flex');
      }
    });

    removeImageBtn.addEventListener('click', () => {
      chatImageInput.value = '';
      imagePreview.classList.remove('d-flex');
      imagePreview.classList.add('d-none');
    });

    // Clear Chat History
    clearChatBtn.addEventListener('click', () => {
      localStorage.removeItem(HISTORY_KEY);
      chatStream.innerHTML = getWelcomeMessageHtml();
      scrollToBottom();
    });

    quickPromptBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const prompt = btn.getAttribute('data-prompt');
        if (prompt.includes('📸 Upload')) {
          chatImageInput.click();
        } else {
          chatMessageInput.value = prompt;
          chatForm.requestSubmit();
        }
      });
    });

    // Form Submit Handler
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageText = chatMessageInput.value.trim();
      const hasImage = chatImageInput.files && chatImageInput.files[0];

      if (!messageText && !hasImage) return;

      const csrfToken = chatForm.querySelector('[name=csrfmiddlewaretoken]').value;
      const fileObj = hasImage ? chatImageInput.files[0] : null;

      let imageSrc = null;
      if (fileObj) {
        imageSrc = URL.createObjectURL(fileObj);
      }

      // Render User Message
      renderUserMessage(messageText, fileObj ? fileObj.name : null, imageSrc, true);

      // FormData preparation
      const formData = new FormData();
      if (messageText) formData.append('message', messageText);
      if (hasImage) formData.append('image', fileObj);

      // Reset Input Fields
      chatMessageInput.value = '';
      chatImageInput.value = '';
      imagePreview.classList.remove('d-flex');
      imagePreview.classList.add('d-none');

      // Render Typing Indicator
      const typingElem = renderTypingIndicator();

      try {
        const response = await fetch("{% url 'agriculture:api_agri_chatbot' %}", {
          method: "POST",
          headers: {
            "X-CSRFToken": csrfToken,
          },
          body: formData,
        });

        const resData = await response.json();
        typingElem.remove();

        if (resData.status === "success" && resData.data) {
          renderBotMessage(resData.data, true);
        } else {
          renderBotErrorMessage(resData.message || "Error processing request.", true);
        }
      } catch (err) {
        typingElem.remove();
        renderBotErrorMessage("Network connection error: " + err.message, true);
      }
    });

    function renderUserMessage(text, imageNameStr, imageSrcUrl, save = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'd-flex justify-content-end mb-3';

      let imgHtml = '';
      if (imageSrcUrl) {
        imgHtml = `<img src="${imageSrcUrl}" class="img-fluid rounded-3 mb-2 d-block shadow-sm" style="max-height: 160px; object-fit: cover;" />`;
      } else if (imageNameStr) {
        imgHtml = `
          <div class="d-flex align-items-center gap-1 mb-1 text-white-50 small" style="font-size: 0.78rem;">
            <i class="bi bi-image"></i> <span>${escapeHtml(imageNameStr)}</span>
          </div>`;
      }

      msgDiv.innerHTML = `
        <div class="text-white p-2 px-3 rounded-4 shadow-sm" style="max-width: 82%; font-size: 0.88rem; background-color: #138844;">
          ${imgHtml}
          <div>${escapeHtml(text || 'Uploaded leaf photo for AI diagnosis')}</div>
        </div>`;

      chatStream.appendChild(msgDiv);
      scrollToBottom();

      if (save) {
        saveHistoryItem({ type: 'user', text: text, imageName: imageNameStr, imageSrc: imageSrcUrl });
      }
    }

    function renderBotMessage(botData, save = true) {
      if (!botData || typeof botData !== 'object') {
        botData = { reply_text: String(botData || 'Response received'), quick_replies: [] };
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = 'd-flex mb-3';

      const formattedText = formatMarkdown(botData.reply_text || '');

      let quickRepliesHtml = '';
      if (botData.quick_replies && botData.quick_replies.length > 0) {
        quickRepliesHtml = `
          <div class="mt-2 pt-2 border-top d-flex flex-wrap gap-1">
            ${botData.quick_replies.map(qr => `
              <button class="btn btn-xs btn-outline-success rounded-pill py-1 px-2 text-nowrap dynamic-floating-qr" style="font-size: 0.75rem; border-color: #138844; color: #138844;" data-qr="${escapeHtml(qr)}">
                ${escapeHtml(qr)}
              </button>
            `).join('')}
          </div>`;
      }

      msgDiv.innerHTML = `
        <div class="bg-white p-3 rounded-4 shadow-sm border border-light" style="max-width: 92%; font-size: 0.88rem;">
          <div class="markdown-body">${formattedText}</div>
          ${quickRepliesHtml}
        </div>`;

      chatStream.appendChild(msgDiv);

      msgDiv.querySelectorAll('.dynamic-floating-qr').forEach(btn => {
        btn.addEventListener('click', () => {
          const qrText = btn.getAttribute('data-qr');
          if (qrText.includes('📸 Upload')) {
            chatImageInput.click();
          } else {
            chatMessageInput.value = qrText;
            chatForm.requestSubmit();
          }
        });
      });

      scrollToBottom();

      if (save) {
        saveHistoryItem({ type: 'bot', data: botData });
      }
    }

    function renderBotErrorMessage(errMsg, save = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'd-flex mb-3';
      msgDiv.innerHTML = `
        <div class="bg-danger-subtle text-danger p-2 px-3 rounded-4 shadow-sm border border-danger-subtle" style="max-width: 92%; font-size: 0.85rem;">
          ${escapeHtml(errMsg)}
        </div>`;
      chatStream.appendChild(msgDiv);
      scrollToBottom();

      if (save) {
        saveHistoryItem({ type: 'error', text: errMsg });
      }
    }

    function renderTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'd-flex mb-3';
      typingDiv.innerHTML = `
        <div class="bg-white p-2 px-3 rounded-4 shadow-sm border border-light d-flex align-items-center gap-2" style="font-size: 0.82rem;">
          <div class="spinner-grow spinner-grow-sm text-success" role="status" style="color: #138844 !important;"></div>
          <span class="text-muted">AgriBot analyzing dataset & AI models...</span>
        </div>`;
      chatStream.appendChild(typingDiv);
      scrollToBottom();
      return typingDiv;
    }

    function formatMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      html = html.replace(/^### (.*$)/gim, '<h6 class="fw-bold text-success mt-2 mb-1" style="color: #138844 !important; font-size: 0.92rem;">$1</h6>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/`(.*?)`/g, '<code class="bg-light text-success px-1 rounded" style="font-size: 0.82rem;">$1</code>');
      html = html.replace(/^- (.*$)/gim, '• $1<br>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  });
</script>
{% endif %}
