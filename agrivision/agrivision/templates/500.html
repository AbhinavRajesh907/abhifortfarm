{% extends "base.html" %}

{% block title %}Server Error (500) — AgriFarm{% endblock title %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="mb-3">
          <span style="font-size: 4rem;">⚙️</span>
        </div>
        <h1 class="display-5 fw-bold text-danger mb-2">500</h1>
        <h3 class="fw-bold text-dark mb-3">Server Encountered an Error</h3>
        <p class="text-muted mb-4">
          Something unexpected happened while processing your request. Our technical team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a href="{% url 'home' %}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
          </a>
          <button onclick="window.location.reload()" class="btn btn-success rounded-pill px-4">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh Page
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
